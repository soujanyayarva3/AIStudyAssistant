
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ai-study-assistant-backend

    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"

      Ollama__BaseUrl: "http://host.docker.internal:11434"

      ConnectionStrings__DefaultConnection: "Host=host.docker.internal;Port=5432;Database=AIStudyAssistantDB;Username=postgres;Password=${POSTGRES_PASSWORD}"

      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "AIStudyAssistantAPI"
      Jwt__Audience: "AIStudyAssistantUsers"
      Jwt__ExpiryInMinutes: "60"

      Email__From: "soujji53@gmail.com"
      Email__SmtpServer: "smtp.gmail.com"
      Email__Port: "587"
      Email__Username: "soujji53@gmail.com"
      Email__Password: "${EMAIL_PASSWORD}"

